name: Integrate NoMount

# Manually triggered. Runs the NoMount "dev" setup script (self-contained:
# symlinks fs/nomount -> NoMount/kernel/src and wires fs/Makefile + fs/Kconfig,
# with NO VFS source patching), then commits it as NORMAL FILES — explicitly
# NOT as a git submodule / gitlink.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-nomount-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

      - name: Fail if working tree is dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean."
            git status --short
            exit 1
          fi

      - name: Run the NoMount (dev) setup script
        run: |
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -

      - name: Enable CONFIG_NOMOUNT in the defconfig
        run: |
          DEF=arch/arm64/configs/defconfig
          grep -q '^CONFIG_NOMOUNT=' "$DEF" || echo 'CONFIG_NOMOUNT=y' >> "$DEF"

      # --- CRITICAL: this is what prevents a gitlink -------------------------
      # The setup script does `git clone ... NoMount`, so NoMount/ is a real
      # nested git repository. Left in place, `git add` stages it as a gitlink
      # (mode 160000). Remove the nested .git so it commits as ordinary files.
      - name: Strip the nested NoMount git repository
        run: |
          if [ -d NoMount/.git ]; then
            echo "Removing nested NoMount/.git ..."
            rm -rf NoMount/.git
          fi
          find NoMount -name .git -print 2>/dev/null
          echo "done"

      - name: Verify the integration landed
        run: |
          set -e
          test -L fs/nomount                              || { echo "::error::fs/nomount symlink missing"; exit 1; }
          test -f fs/nomount/nomount.c                    || { echo "::error::symlink target (NoMount/kernel/src) missing"; exit 1; }
          grep -q 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile \
              || { echo "::error::fs/Makefile not patched"; exit 1; }
          grep -q 'fs/nomount/Kconfig' fs/Kconfig \
              || { echo "::error::fs/Kconfig not patched"; exit 1; }
          grep -q '^CONFIG_NOMOUNT=y' arch/arm64/configs/defconfig \
              || { echo "::error::CONFIG_NOMOUNT not set"; exit 1; }
          echo "NoMount source files: $(find NoMount -type f | wc -l)"

      - name: Stage changes
        run: git add -A

      # --- Guard: refuse to push if any gitlink was staged -------------------
      - name: Assert NO gitlink (mode 160000) was staged
        run: |
          links=$(git ls-files --stage | awk '$1 == "160000" { print $4 }')
          if [ -n "$links" ]; then
            echo "::error::A gitlink (mode 160000) was staged. NoMount must be committed as normal files."
            echo "$links"
            exit 1
          fi
          echo "OK: no gitlink staged."
          echo "--- staged summary ---"
          git diff --cached --stat | tail -n 5

      - name: Commit
        run: |
          if git diff --cached --quiet; then
            echo "::error::Setup produced no changes."
            exit 1
          fi
          git commit -m "fs: integrate NoMount (path redirection subsystem)"

      - name: Push
        run: git push origin HEAD:${{ github.ref_name }}
