name: GTA4L SUSFS Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta4l-susfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build GTA4L SUSFS
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Checkout the GTA4L kernel source
      # ------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      # ------------------------------------------------------------
      # Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            lz4 \
            cpio \
            libncurses5-dev \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            wget

      # ------------------------------------------------------------
      # Download the compiler used for your successful builds
      # ------------------------------------------------------------
      - name: Download LineageOS Clang r416183b
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            clang

      - name: Show compiler version
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version

      # ------------------------------------------------------------
      # Show repository state
      #
      # No dirty-tree failure here.
      # ------------------------------------------------------------
      - name: Show source tree status
        run: |
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Source tree:"
          git status --short

      # ------------------------------------------------------------
      # Verify SUSFS patch
      # ------------------------------------------------------------
      - name: Verify SUSFS patch
        run: |
          set -e

          PATCH="patches/susfs-gta4l-lineage23.2-v2.3.0-improved.patch"

          if [ ! -f "$PATCH" ]; then
            echo "::error::SUSFS patch not found:"
            echo "$PATCH"
            exit 1
          fi

          echo "SUSFS patch:"
          ls -lh "$PATCH"

          echo
          echo "SHA256:"
          sha256sum "$PATCH"

      # ------------------------------------------------------------
      # IMPORTANT:
      # Check the complete patch before changing the source tree.
      # ------------------------------------------------------------
      - name: Check SUSFS patch
        run: |
          set -e
          PATCH="patches/susfs-gta4l-lineage23.2-v3.0-fixed.patch"

          echo "Checking SUSFS patch against the GTA4L kernel source..."
          git apply --check --recount --verbose "$PATCH"

      - name: Apply SUSFS patch
        run: |
          set -e
          PATCH="patches/susfs-gta4l-lineage23.2-v3.0-fixed.patch"

          echo "Applying SUSFS patch..."
          git apply --recount --verbose "$PATCH"
      # ------------------------------------------------------------
      # Verify SUSFS files
      # ------------------------------------------------------------
      - name: Verify SUSFS integration
        run: |
          set -e

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h

          echo "SUSFS core:"
          ls -lh fs/susfs.c

          echo
          echo "SUSFS headers:"
          ls -lh include/linux/susfs.h
          ls -lh include/linux/susfs_def.h

      # ------------------------------------------------------------
      # Verify the KSU SUSFS hooks required by this tree
      # ------------------------------------------------------------
      - name: Verify KernelSU SUSFS hooks
        run: |
          set -e

          echo "Checking required SUSFS hooks..."

          grep -R "ksu_handle_setresuid" KernelSU/kernel
          grep -R "ksu_handle_execveat" KernelSU/kernel
          grep -R "ksu_handle_faccessat" KernelSU/kernel
          grep -R "ksu_handle_sys_read" KernelSU/kernel
          grep -R "ksu_handle_stat" KernelSU/kernel
          grep -R "ksu_handle_sys_reboot" KernelSU/kernel
          grep -R "ksu_handle_input_handle_event" KernelSU/kernel

          echo
          echo "Checking for obsolete hooks..."

          if grep -R \
            -E \
            "ksu_vfs_read_hook|ksu_input_hook|ksu_execveat_hook|ksu_init_rc_hook" \
            KernelSU/kernel; then

            echo "::error::Obsolete KernelSU hook detected."
            exit 1
          fi

          echo
          echo "KernelSU SUSFS hook verification PASSED."

      # ------------------------------------------------------------
      # Verify NoMount
      # ------------------------------------------------------------
      - name: Verify NoMount
        run: |
          set -e

          if [ ! -L fs/nomount ]; then
            echo "::error::fs/nomount symlink is missing."
            exit 1
          fi

          if ! grep -q '^CONFIG_NOMOUNT=y' \
            arch/arm64/configs/defconfig; then

            echo "::error::CONFIG_NOMOUNT=y is missing."
            exit 1
          fi

          echo "NoMount:"
          readlink fs/nomount

          echo
          grep '^CONFIG_NOMOUNT=y' \
            arch/arm64/configs/defconfig

      # ------------------------------------------------------------
      # Generate kernel configuration
      # ------------------------------------------------------------
      - name: Generate defconfig
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            defconfig

      # ------------------------------------------------------------
      # Verify generated configuration
      # ------------------------------------------------------------
      - name: Verify generated configuration
        run: |
          set -e

          echo "SUSFS / KSU / NoMount configuration:"
          grep -E \
            '^(CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_KALLSYMS|CONFIG_MODULES)' \
            out/.config || true

          echo
          echo "Checking CONFIG_KSU_SUSFS..."

          if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "::error::CONFIG_KSU_SUSFS=y is missing from out/.config"
            exit 1
          fi

          echo "CONFIG_KSU_SUSFS=y"

          echo
          echo "Checking CONFIG_NOMOUNT..."

          if ! grep -q '^CONFIG_NOMOUNT=y' out/.config; then
            echo "::error::CONFIG_NOMOUNT=y is missing from out/.config"
            exit 1
          fi

          echo "CONFIG_NOMOUNT=y"

      # ------------------------------------------------------------
      # Build the kernel
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb \
            dtbs \
            modules

      # ------------------------------------------------------------
      # Verify kernel output
      # ------------------------------------------------------------
      - name: Verify kernel output
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image.gz-dtb was not produced."

            echo
            echo "Available boot files:"
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              -print

            exit 1
          fi

          echo "Kernel successfully built:"
          ls -lh "$IMAGE"

          echo
          echo "Image information:"
          file "$IMAGE"

      # ------------------------------------------------------------
      # Prepare artifacts
      # ------------------------------------------------------------
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p artifact

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            artifact/gta4l-susfs-Image.gz-dtb

          cp \
            out/.config \
            artifact/gta4l-susfs-config

          cp \
            patches/susfs-gta4l-lineage23.2-v2.3.0-improved.patch \
            artifact/

          sha256sum artifact/* \
            > artifact/SHA256SUMS

          echo "Artifacts:"
          ls -lh artifact/

          echo
          echo "Checksums:"
          cat artifact/SHA256SUMS

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------
      - name: Upload GTA4L SUSFS kernel
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-susfs-kernel
          path: artifact/
          if-no-files-found: error
          retention-days: 14
