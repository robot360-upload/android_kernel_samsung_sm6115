name: Build SM6115 Kernel with Neutron Clang and SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: robot360-upload/android_kernel_samsung_sm6115
          ref: lineage-24.0
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev patch \
            python3 rsync tar unzip zstd

      - name: Download Neutron Clang
        run: |
          set -e
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman
          chmod +x antman
          ./antman -S
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron Clang and LLVM linker
        run: |
          set -e
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          export PATH="$TOOLCHAIN/bin:$PATH"
          command -v clang
          command -v ld.lld
          clang --version
          ld.lld --version
          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"

      - name: Download and verify SUSFS non-GKI Linux 4.19 patch
        run: |
          set -euo pipefail
          PATCH_URL="https://raw.githubusercontent.com/cyberc3dr/nGKI_Kernel_Build/rebase/Patches/Patch/susfs_patch_to_4.19.patch"
          curl -fL "$PATCH_URL" -o /tmp/susfs_patch_to_4.19.patch

          # Confirm this is the expected non-GKI patch, not an HTML error page.
          grep -q 'diff --git a/fs/susfs.c b/fs/susfs.c' /tmp/susfs_patch_to_4.19.patch
          grep -q '#define SUSFS_VARIANT "NON-GKI"' /tmp/susfs_patch_to_4.19.patch
          grep -q '#define SUSFS_VERSION "v2.3.0"' /tmp/susfs_patch_to_4.19.patch

          echo "Reference patch identifies itself as SUSFS v2.3.0 NON-GKI."
          echo "Checking patch applicability before modifying source..."
          patch --dry-run --forward -p1 < /tmp/susfs_patch_to_4.19.patch

      - name: Apply SUSFS patch
        run: |
          set -euo pipefail
          patch --forward -p1 < /tmp/susfs_patch_to_4.19.patch
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h

      - name: Verify kernel configuration files
        run: |
          set -e
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config
          test -f scripts/kconfig/merge_config.sh

      - name: Generate base configuration
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            vendor/bengal-perf_defconfig

      - name: Merge device and SUSFS configuration
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          cat > /tmp/susfs.config <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          EOF

          scripts/kconfig/merge_config.sh \
            -O out \
            -m out/.config \
            arch/arm64/configs/vendor/gta4l-common.config \
            /tmp/susfs.config

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "Checking required SUSFS configuration survived Kconfig..."
          for symbol in \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT
          do
            if ! grep -qx "${symbol}=y" out/.config; then
              echo "::error::${symbol} is not enabled after olddefconfig."
              echo "The current KernelSU/ReSukiSU Kconfig may not define this SUSFS option."
              echo "Do not continue with a kernel that silently omits SUSFS."
              exit 1
            fi
          done

          grep -E '^CONFIG_KSU_SUSFS(_|=)' out/.config || true

      - name: Build kernel Image
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            -j2 Image

      - name: Verify kernel image and SUSFS object
        run: |
          set -euo pipefail
          IMAGE="out/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test -s out/fs/susfs.o
          file "$IMAGE"
          ls -lh "$IMAGE" out/fs/susfs.o

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-neutron-clang-susfs-v2.3.0-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
