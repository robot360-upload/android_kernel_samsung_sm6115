name: Build1 SM6115 Kernel with Neutron Clang
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: robot360-upload/android_kernel_samsung_sm6115
          ref: lineage-24.0
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev python3 \
            rsync tar unzip zstd
      - name: Integrate BakaSU
        run: |
          set -euxo pipefail
          curl -LSs \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" \
            | bash
          test -d KernelSU/kernel
          echo "BakaSU commit:"
          git -C KernelSU rev-parse HEAD
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'CONFIG_KSU' drivers/Makefile
      - name: Apply BakaSU Linux 4.19 manual-hook patch
        run: |
          set -euxo pipefail
          PATCH_URL="https://raw.githubusercontent.com/robot360-upload/patches/main/bakasu_hooks_corrected.patch"
          curl -fL "$PATCH_URL" -o /tmp/bakasu_hooks_corrected.patch
          # Do not modify the source if the patch cannot apply cleanly.
          git apply --check /tmp/bakasu_hooks_corrected.patch
          git apply /tmp/bakasu_hooks_corrected.patch
          git diff --check
          git diff --stat
          sha256sum /tmp/bakasu_hooks_corrected.patch
      - name: Integrate NoMount
        run: |
          set -euxo pipefail
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            | bash
          test -L fs/nomount
          test -f fs/nomount/Kconfig
          echo "NoMount commit:"
          git -C NoMount rev-parse HEAD
          grep -q 'CONFIG_NOMOUNT' fs/Makefile
          grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig
      - name: Configure BakaSU, NoMount, and local version
        run: |
          set -euo pipefail
          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"
          test -f "$CONFIG"
          # Remove previous copies of these settings.
          sed -i -E \
            '/^(CONFIG_LOCALVERSION=|# CONFIG_LOCALVERSION_AUTO is not set|CONFIG_LOCALVERSION_AUTO=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=|CONFIG_NOMOUNT=)/d' \
            "$CONFIG"
          cat >> "$CONFIG" <<'EOF'
          # Kernel release string
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n
          # BakaSU manual hooks
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          # NoMount
          CONFIG_NOMOUNT=y
          EOF
          cat "$CONFIG"
      - name: Download Neutron Clang
        run: |
          set -euo pipefail
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman
          chmod +x antman
          ./antman -S
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
      - name: Verify Neutron Clang and LLVM linker
        run: |
          set -euo pipefail
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          export PATH="$TOOLCHAIN/bin:$PATH"
          command -v clang
          command -v ld.lld
          clang --version
          ld.lld --version
          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"
      - name: Verify kernel configuration files
        run: |
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config
          test -f scripts/kconfig/merge_config.sh
      - name: Generate base configuration
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig
      - name: Merge device configuration
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          scripts/kconfig/merge_config.sh \
            -O out \
            -m out/.config \
            arch/arm64/configs/vendor/gta4l-common.config
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
      - name: Verify final kernel configuration
        run: |
          set -euo pipefail
          CONFIG="out/.config"
          grep -qx 'CONFIG_LOCALVERSION=""' "$CONFIG"
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' "$CONFIG"
          grep -qx 'CONFIG_KSU=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_NOMOUNT=y' "$CONFIG"
          # Verify the automatic hooks expected for this Linux 4.19 integration.
          grep -qx 'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y' "$CONFIG"
          # The selected hooking method must be manual, not tracepoint.
          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "ERROR: tracepoint hooking is enabled instead of manual hooking." >&2
            exit 1
          fi
          grep -E \
            '^(CONFIG_LOCALVERSION=|# CONFIG_LOCALVERSION_AUTO|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_|CONFIG_NOMOUNT=)' \
            "$CONFIG"
      - name: Build kernel Image
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j2 \
            Image
      - name: Upload Module.symvers
        uses: actions/upload-artifact@v4
        with:
          name: Module-symvers
          path: kernel/out/Module.symvers
          if-no-files-found: error
      - name: Verify kernel image
        run: |
          set -euo pipefail
          IMAGE="out/arch/arm64/boot/Image"
          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"
      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-bakasu-nomount-neutron-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
