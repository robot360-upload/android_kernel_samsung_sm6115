name: Apply BakaSU Manual Hooks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hooks:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 0

      - name: Download BakaSU patch
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/robot360-upload/Custom-Kernel-Builder/main/bakasu-manual-hooks.patch" \
            -o "$RUNNER_TEMP/bakasu-manual-hooks.patch"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply BakaSU hooks
        run: |
          PATCH="$RUNNER_TEMP/bakasu-manual-hooks.patch"

          if git apply --check "$PATCH"; then
            git apply "$PATCH"
            echo "[+] Patch applied successfully."
          elif git apply --reverse --check "$PATCH"; then
            echo "[!] Patch already applied."
            exit 0
          else
            echo "[!] Patch cannot be applied cleanly."
            exit 1
          fi

      - name: Commit and push
        run: |
          git add -u

          if git diff --cached --quiet; then
            echo "[+] No changes to commit."
            exit 0
          fi

          git commit -m "Integrate BakaSU manual hooks"
          git push origin HEAD:lineage-24.0
