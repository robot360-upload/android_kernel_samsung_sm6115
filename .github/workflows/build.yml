name: Build SM6115 Kernel
on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: "Google Clang version to test"
        required: true
        type: choice
        default: r614150
        options:
          - r547379
          - r596125
          - r614150
permissions:
  contents: read
concurrency:
  group: kernel-build-${{ github.ref }}-${{ inputs.clang_version }}
  cancel-in-progress: false
jobs:
  build:
    name: Build with Clang ${{ inputs.clang_version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 0
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip
      - name: Download selected Google Clang
        id: clang
        env:
          CLANG_VERSION: ${{ inputs.clang_version }}
        run: |
          set -euo pipefail
          TOOLCHAIN_REPO="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          echo "Requested Clang: ${CLANG_VERSION}"
          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            "${TOOLCHAIN_REPO}" \
            "$RUNNER_TEMP/google-clang"
          cd "$RUNNER_TEMP/google-clang"
          TOOLCHAIN_DIR="clang-${CLANG_VERSION}"
          if ! git ls-tree --name-only HEAD "$TOOLCHAIN_DIR" | grep -qx "$TOOLCHAIN_DIR"; then
            echo "::error::${TOOLCHAIN_DIR} does not exist in the checked-out Google toolchain repository."
            exit 1
          fi
          git sparse-checkout set "$TOOLCHAIN_DIR"
          CLANG_PATH="$RUNNER_TEMP/google-clang/$TOOLCHAIN_DIR/bin"
          if [ ! -x "$CLANG_PATH/clang" ]; then
            echo "::error::Clang executable not found at $CLANG_PATH/clang"
            exit 1
          fi
          echo "$CLANG_PATH" >> "$GITHUB_PATH"
          echo "clang_path=$CLANG_PATH" >> "$GITHUB_OUTPUT"
          "$CLANG_PATH/clang" --version
      - name: Verify source and configuration files
        run: |
          set -euo pipefail
          echo "Kernel branch:"
          git branch --show-current
          echo "Kernel commit:"
          git rev-parse HEAD
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config
          test -f Makefile
          echo "Required kernel files found."
      - name: Configure kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          # 1. Load the device-specific configuration
          make O=out vendor/bengal-perf_defconfig

          # 2. Extract only the existing KSU settings from generic defconfig
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=)' \
            arch/arm64/configs/defconfig > out/ksu.config

          # 3. Explicitly select manual hooks instead of tracepoint hooks
          cat >> out/ksu.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          EOF

          # 4. Merge only the selected settings
          scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            out/ksu.config

          # 5. Apply device-specific configuration
          scripts/kconfig/merge_config.sh \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          # 6. Resolve dependencies and Kconfig choices
          make O=out olddefconfig

          # 7. Save and verify the resulting configuration
          cp out/.config kernel.config

          echo "===== BakaSU configuration ====="
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=|CONFIG_KSU_TRACEPOINT_HOOK=|# CONFIG_KSU_TRACEPOINT_HOOK is not set)' \
            out/.config || true
      - name: Build Image and Image.gz
        id: build
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          JOBS="$(nproc)"
          echo "Compiler:"
          clang --version
          echo "Build jobs: $JOBS"
          make -j"$JOBS" O=out Image Image.gz 2>&1 | tee build.log
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          echo "Kernel images built successfully."
      - name: Collect build information
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "Selected Clang: ${{ inputs.clang_version }}"
            echo "Source repository: $GITHUB_REPOSITORY"
            echo "Source branch: lineage-24.0"
            echo "Source commit: $(git rev-parse HEAD)"
            echo
            echo "Compiler version:"
            clang --version 2>&1 || true
            echo
            echo "Kernel release, if configured:"
            make -s O=out kernelrelease 2>&1 || true
          } > artifacts/build-info.txt
          if [ -f build.log ]; then
            cp build.log artifacts/
          fi
          if [ -f kernel.config ]; then
            cp kernel.config artifacts/
          elif [ -f out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi
          if [ -s out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/
          fi
          if [ -s out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz artifacts/
          fi
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-clang-${{ inputs.clang_version }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
