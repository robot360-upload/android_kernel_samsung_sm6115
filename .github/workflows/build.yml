name: Build KernelSU Next - GTA4L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            bc \
            bison \
            flex \
            cpio \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3 \
            rsync \
            zip \
            unzip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ---------------------------------------------------------
      # Get official LineageOS SM6115 kernel
      # ---------------------------------------------------------
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git \
            kernel

      - name: Verify kernel source
        working-directory: kernel
        run: |
          test -f Makefile
          test -d drivers
          test -d fs
          test -d arch/arm64

          echo "Kernel source OK"
          git log -1 --oneline

      # ---------------------------------------------------------
      # Clone REAL KernelSU Next source
      # ---------------------------------------------------------
      - name: Clone KernelSU Next
        working-directory: kernel
        run: |
          rm -rf KernelSU-Next

          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "=== KernelSU Next ==="
          git log -1 --oneline -- KernelSU-Next 2>/dev/null || true

          echo "=== Directory ==="
          ls -la KernelSU-Next

          echo "=== kernel/ ==="
          ls -la KernelSU-Next/kernel

          test -f KernelSU-Next/kernel/ksu.c
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "KernelSU Next source verified."

      # ---------------------------------------------------------
      # Official KernelSU Next integration
      # ---------------------------------------------------------
      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

      # ---------------------------------------------------------
      # Verify integration
      # ---------------------------------------------------------
      - name: Verify KernelSU Next source
        working-directory: kernel
        run: |
          echo "=== KernelSU Next source ==="
          test -d KernelSU-Next/kernel
          test -f KernelSU-Next/kernel/Kconfig
          test -f KernelSU-Next/kernel/Makefile

          echo "KernelSU Next source is present."

          echo
          echo "KernelSU Next kernel tree:"
          find KernelSU-Next/kernel -maxdepth 2 -type f | sort | head -100

      # ---------------------------------------------------------
      # Add GTA4L manual hooks
      # ---------------------------------------------------------
      - name: Add KernelSU manual hooks
        working-directory: kernel
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_text()

              if new in data:
                  print(f"{path}: already patched")
                  return

              if old not in data:
                  raise RuntimeError(
                      f"{path}: required source block was not found"
                  )

              data = data.replace(old, new, 1)
              p.write_text(data)
              print(f"{path}: patched")

          # -----------------------------------------------------
          # fs/exec.c
          # -----------------------------------------------------
          replace_once(
              "fs/exec.c",
              """int do_execve(struct filename *filename,
                  const char __user *const __user *__argv,
                  const char __user *const __user *__envp)
              {""",
              """extern int ksu_handle_execveat(int *fd,
                  struct filename **filename,
                  void *argv,
                  void *envp,
                  int *flags);

              int do_execve(struct filename *filename,
                  const char __user *const __user *__argv,
                  const char __user *const __user *__envp)
              {
                  ksu_handle_execveat(NULL, &filename, (void *)__argv,
                      (void *)__envp, NULL);"""
          )

          replace_once(
              "fs/exec.c",
              """static int compat_do_execve(struct filename *filename,
                  const compat_uptr_t __user *__argv,
                  const compat_uptr_t __user *__envp)
              {""",
              """static int compat_do_execve(struct filename *filename,
                  const compat_uptr_t __user *__argv,
                  const compat_uptr_t __user *__envp)
              {
                  ksu_handle_execveat(NULL, &filename, (void *)__argv,
                      (void *)__envp, NULL);"""
          )

          # -----------------------------------------------------
          # fs/open.c
          # -----------------------------------------------------
          replace_once(
              "fs/open.c",
              """long do_faccessat(int dfd, const char __user *filename, int mode)
              {""",
              """extern int ksu_handle_faccessat(int *dfd,
                  const char __user **filename, int *mode);

              long do_faccessat(int dfd, const char __user *filename, int mode)
              {"""
          )

          replace_once(
              "fs/open.c",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
              {
                  return do_faccessat(dfd, filename, mode);
              }""",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
              {
                  ksu_handle_faccessat(&dfd, &filename, &mode);
                  return do_faccessat(dfd, filename, mode);
              }"""
          )

          # -----------------------------------------------------
          # fs/read_write.c
          # -----------------------------------------------------
          replace_once(
              "fs/read_write.c",
              """SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
              {
                  return ksys_read(fd, buf, count);
              }""",
              """extern int ksu_vfs_read_hook(struct file **file,
                  char __user **buf, size_t *count, loff_t **pos);

              extern int ksu_handle_sys_read(unsigned int fd,
                  char __user **buf, size_t *count);

              SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)
              {
                  ksu_handle_sys_read(fd, &buf, &count);
                  return ksys_read(fd, buf, count);
              }"""
          )

          # -----------------------------------------------------
          # fs/stat.c
          # -----------------------------------------------------
          replace_once(
              "fs/stat.c",
              """SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
                  struct stat __user *, statbuf, int, flag)
              {
                  struct kstat stat;""",
              """extern int ksu_handle_stat(int *dfd,
                  const char __user **filename, int *flags);

              SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
                  struct stat __user *, statbuf, int, flag)
              {
                  struct kstat stat;

                  ksu_handle_stat(&dfd, &filename, &flag);"""
          )

          # -----------------------------------------------------
          # kernel/reboot.c
          # -----------------------------------------------------
          replace_once(
              "kernel/reboot.c",
              """SYSCALL_DEFINE4(reboot, int magic1, int magic2, unsigned int cmd,
                  void __user *, arg)
              {
                  struct pid_namespace *pid_ns = task_active_pid_ns(current);""",
              """extern int ksu_handle_sys_reboot(int magic1, int magic2,
                  unsigned int cmd, void __user **arg);

              SYSCALL_DEFINE4(reboot, int magic1, int magic2, unsigned int cmd,
                  void __user *, arg)
              {
                  ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);

                  struct pid_namespace *pid_ns = task_active_pid_ns(current);"""
          )

          print("Manual hooks completed.")
          PY

      # ---------------------------------------------------------
      # Show hook verification
      # ---------------------------------------------------------
      - name: Verify manual hooks
        working-directory: kernel
        run: |
          echo "=== exec hook ==="
          grep -n "ksu_handle_execveat" fs/exec.c

          echo "=== faccessat hook ==="
          grep -n "ksu_handle_faccessat" fs/open.c

          echo "=== read hook ==="
          grep -n "ksu_handle_sys_read" fs/read_write.c

          echo "=== stat hook ==="
          grep -n "ksu_handle_stat" fs/stat.c

          echo "=== reboot hook ==="
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c

      # ---------------------------------------------------------
      # Prepare configuration
      # ---------------------------------------------------------
      - name: Prepare kernel configuration
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            bengal-perf_defconfig

          if [ -f arch/arm64/configs/gta4l-common.config ]; then
            echo "Merging GTA4L common config..."
            scripts/kconfig/merge_config.sh \
              -m -O out \
              out/.config \
              arch/arm64/configs/gta4l-common.config
          fi

          # Enable KernelSU in the generated build configuration.
          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      # ---------------------------------------------------------
      # Verify CONFIG_KSU
      # ---------------------------------------------------------
      - name: Verify CONFIG_KSU
        working-directory: kernel
        run: |
          grep '^CONFIG_KSU=' out/.config

          test "$(grep '^CONFIG_KSU=' out/.config)" = "CONFIG_KSU=y"

          echo "CONFIG_KSU=y confirmed."

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build kernel
        working-directory: kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      # ---------------------------------------------------------
      # Verify output
      # ---------------------------------------------------------
      - name: Verify kernel output
        working-directory: kernel
        run: |
          echo "=== Kernel outputs ==="

          ls -lh out/arch/arm64/boot/Image* || true

          test -f out/arch/arm64/boot/Image

          echo "Kernel built successfully."

      # ---------------------------------------------------------
      # Upload
      # ---------------------------------------------------------
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-kernelsu-next-kernel
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/.config
