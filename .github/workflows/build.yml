name: Build SM6115 Kernel with Neutron Clang
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: robot360-upload/android_kernel_samsung_sm6115
          ref: lineage-24.0
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            tar \
            unzip \
            zstd
      - name: Download Neutron Clang
        run: |
          set -e
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman
          chmod +x antman
          ./antman -S
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
      - name: Verify Neutron Clang and LLVM linker
        run: |
          set -e
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          export PATH="$TOOLCHAIN/bin:$PATH"
          command -v clang
          command -v ld.lld
          clang --version
          ld.lld --version
          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"
      - name: Verify kernel configuration files
        run: |
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config
          test -f scripts/kconfig/merge_config.sh
      - name: Generate base configuration
        run: |
          set -e
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig
      - name: Merge device configuration
        run: |
          set -e
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          scripts/kconfig/merge_config.sh \
            -O out \
            -m out/.config \
            arch/arm64/configs/vendor/gta4l-common.config
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
      - name: Build kernel Image
        run: |
          set -e
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j2 \
            Image
      - name: Verify kernel image
        run: |
          set -e
          IMAGE="out/arch/arm64/boot/Image"
          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"
      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-neutron-clang-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
