name: Build SM6115 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev \
            lld llvm make python3 rsync zstd

      - name: Install Neutron Clang
        run: |
          set -e
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S

          test -x bin/clang
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          ./antman --patch=glibc
          ./antman -I
          bin/clang --version
          bin/ld.lld --version
      - name: Clone LineageOS kernel
        run: |
          git clone --depth=1 \
            --branch lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115 \
            kernel

      - name: Install KernelSU-Next legacy mode
        working-directory: kernel
        run: |
          set -e
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

      - name: Diagnose KernelSU path_umount
        working-directory: kernel
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Kernel version ==="
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

          echo "=== KSU_HAS_PATH_UMOUNT definitions ==="
          git grep -n 'KSU_HAS_PATH_UMOUNT' || true
          grep -R -n 'KSU_HAS_PATH_UMOUNT' \
            drivers/kernelsu include/linux Makefile \
            2>/dev/null || true

          echo "=== path_umount references ==="
          git grep -n -w 'path_umount' || true

          echo "=== KernelSU umount implementation ==="
          sed -n '1,100p' drivers/kernelsu/feature/kernel_umount.c

          echo "=== Compiler flags, if available ==="
          if [ -f drivers/kernelsu/feature/.kernel_umount.o.cmd ]; then
            grep -oE -- '-D[K]SU_HAS_PATH_UMOUNT(=[^ ]+)?' \
              drivers/kernelsu/feature/.kernel_umount.o.cmd || true
          else
            echo "No kernel_umount.o command file yet"
          fi
      - name: Fix KernelSU umount compatibility for 4.19
        working-directory: kernel
        run: |
          sed -i '/ccflags-y += -DKSU_HAS_PATH_UMOUNT/d' \
            drivers/kernelsu/Kbuild

          echo "=== Verify macro definition removed ==="
          if grep -n 'KSU_HAS_PATH_UMOUNT' drivers/kernelsu/Kbuild; then
            echo "ERROR: macro definition still exists"
            exit 1
          else
            echo "OK: forced definition removed"
          fi
      - name: Inspect KernelSU-Next Kconfig
        working-directory: kernel
        run: |
          set -e

          KSU_DIR="drivers/kernelsu"

          echo "=== KernelSU source path ==="
          readlink -f "$KSU_DIR"
          test -d "$KSU_DIR"

          echo "=== Kconfig files ==="
          find -L "$KSU_DIR" -type f -name 'Kconfig'

          echo "=== KSU and Kprobe declarations ==="
          grep -R -n -E \
            'config KSU|KPROBE|KPROBES|KSU_KPROBE' \
            "$KSU_DIR" \
            --include='Kconfig' \
            --include='*.Kconfig' \
            --include='Makefile' || true
      - name: Add KernelSU configs
        working-directory: kernel
        shell: bash
        run: |
          set -e

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"
          test -f "$CONFIG"

          for option in \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KRETPROBES \
            CONFIG_KSU_KPROBES_HOOK \
            CONFIG_KSU_KPROBE_HOOKS \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KSU
          do
            sed -i \
              "/^${option}=/d; /^# ${option} is not set$/d" \
              "$CONFIG"
          done

          cat >> "$CONFIG" <<'EOF'

          # KernelSU-Next dynamic Kprobe hook configuration
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KRETPROBES=y
          CONFIG_KSU=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_KPROBES_HOOK=y
          EOF
      - name: Install NoMount
        working-directory: kernel
        run: |
          set -e
          curl -fLSs \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
            | bash -

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          make O=out olddefconfig

      - name: Find WiFi and audio Kconfig symbols
        working-directory: kernel
        run: |
          set -e

          echo "=== WiFi driver ==="
          grep -R -n -E 'qca_cld3_wlan\.o|qca_cld3_wlan-y' \
            drivers --include='Makefile' --include='Kbuild' || true

          echo "=== Audio driver build entries ==="
          for module in \
            audio_adsp_loader audio_apr audio_bolero_cdc \
            audio_fs18xx audio_machine_bengal audio_mbhc \
            audio_q6 audio_q6_notifier audio_swr audio_swr_ctrl \
            audio_tx_macro audio_va_macro audio_wcd937x \
            audio_wcd937x_slave audio_wcd9xxx audio_wcd_core \
            audio_wsa881x_analog audio_rx_macro audio_platform \
            audio_pinctrl_lpi audio_pm2250_spmi audio_usf \
            audio_native audio_rouleur audio_rouleur_slave \
            audio_snd_event
          do
            echo "--- $module ---"
            grep -R -n -F "$module.o" drivers \
              --include='Makefile' --include='Kbuild' 2>/dev/null || true
          done
      - name: Diagnose KernelSU hook dependencies
        working-directory: kernel
        run: |
          echo "=== Hook Kconfig ==="
          sed -n '40,75p' drivers/kernelsu/Kconfig

          echo "=== Resolved dependency symbols ==="
          grep -E \
            'CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KPROBES|KRETPROBES|HAVE_SYSCALL_TRACEPOINTS|FTRACE|FUNCTION_TRACER)=' \
            out/.config || true

          echo "=== Tracepoint capability definitions ==="
          grep -R -n 'config HAVE_SYSCALL_TRACEPOINTS' \
            arch/arm64 arch/Kconfig kernel \
            --include='Kconfig*' || true
      - name: Verify configuration
        working-directory: kernel
        run: |
          set -e

          for option in \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KRETPROBES \
            CONFIG_KSU_KPROBES_HOOK \
            CONFIG_KSU
          do
            if ! grep -qx "${option}=y" out/.config; then
              echo "ERROR: ${option} is not enabled"
              grep -E "^(${option}=|# ${option} is not set)" \
                out/.config || true
              exit 1
            fi

            echo "Verified: ${option}=y"
          done

      - name: Build uncompressed Image
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          clang --version
          make O=out -j"$(nproc)" Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T505-SM6115-Neutron-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error
          retention-days: 7
