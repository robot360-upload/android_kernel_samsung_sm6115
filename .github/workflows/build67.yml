name: Build SM6115 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev \
            lld llvm make python3 rsync zstd

      - name: Install Neutron Clang
        run: |
          set -e
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S

          test -x bin/clang
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          ./antman --patch=glibc
          ./antman -I
          bin/clang --version
          bin/ld.lld --version
      - name: Clone LineageOS kernel
        run: |
          git clone --depth=1 \
            --branch lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115 \
            kernel

      - name: Install KernelSU-Next legacy mode
        working-directory: kernel
        run: |
          set -e
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

      - name: Create KernelSU config fragment
        working-directory: kernel
        shell: bash
        run: |
          set -e
          mkdir -p arch/arm64/configs/vendor

          printf '%s\n' \
            'CONFIG_MODULES=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_KPROBE_EVENTS=y' \
            'CONFIG_KSU_KPROBE_HOOKS=y' \
            'CONFIG_KSU=y' \
            > arch/arm64/configs/vendor/ksu.config

          echo "Created config fragment:"
          cat arch/arm64/configs/vendor/ksu.config
      - name: Install NoMount
        working-directory: kernel
        run: |
          set -e
          curl -fLSs \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
            | bash -

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config
            arch/arm64/configs/vendor/ksu.config

          make O=out olddefconfig

      - name: Verify configuration
        working-directory: kernel
        run: |
          set -e

          for option in \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KSU_KPROBE_HOOKS \
            CONFIG_KSU
          do
            if ! grep -qx "${option}=y" out/.config; then
              echo "ERROR: $option is not enabled"
              grep -E "^(${option}=|# ${option} is not set)" \
                out/.config || true
              exit 1
            fi
            echo "Verified: ${option}=y"
          done

      - name: Build uncompressed Image
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          clang --version
          make O=out -j"$(nproc)" Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T505-SM6115-Neutron-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error
          retention-days: 7
