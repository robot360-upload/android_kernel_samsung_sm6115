name: Build SM6115 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev \
            lld llvm make python3 rsync zstd

      - name: Install Neutron Clang
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S
          test -x bin/clang
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          ./antman --patch=glibc
          ./antman -I
          bin/clang --version
          bin/ld.lld --version

      - name: Clone LineageOS kernel
        run: |
          set -euo pipefail
          git clone --depth=1 \
            --branch lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115 \
            kernel

      - name: Install KernelSU-Next
        working-directory: kernel
        run: |
          set -euo pipefail
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          test -f drivers/kernelsu/Kconfig
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Replace six kernel source files
        working-directory: kernel
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/robot360-upload/patches/main"

          curl -fL "$BASE/open.c" -o fs/open.c
          curl -fL "$BASE/stat.c" -o fs/stat.c
          curl -fL "$BASE/read_write.c" -o fs/read_write.c
          curl -fL "$BASE/exec.c" -o fs/exec.c
          curl -fL "$BASE/namespace.c" -o fs/namespace.c
          curl -fL "$BASE/reboot.c" -o kernel/reboot.c

          test -s fs/open.c
          test -s fs/stat.c
          test -s fs/read_write.c
          test -s fs/exec.c
          test -s fs/namespace.c
          test -s kernel/reboot.c

          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'path_umount' fs/namespace.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

          git diff --check

      - name: Add only CONFIG_KSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"
          test -f "$CONFIG"

          for option in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KSU_KPROBE_HOOK \
            CONFIG_KSU_KPROBES_HOOK \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KRETPROBES \
            CONFIG_NOMOUNT
          do
            sed -i \
              "/^${option}=/d; /^# ${option} is not set$/d" \
              "$CONFIG"
          done

          printf '\nCONFIG_KSU=y\n' >> "$CONFIG"
          tail -n 20 "$CONFIG"

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          make O=out olddefconfig

      - name: Upload kernel .config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: kernel/out/.config
          if-no-files-found: error
      - name: Verify configuration and hooks
        working-directory: kernel
        run: |
          set -euo pipefail

          grep -qx 'CONFIG_KSU=y' out/.config

          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

          echo "Verified CONFIG_KSU=y"
          echo "Verified all five replacement source files"

      - name: Build uncompressed Image
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          clang --version
          make O=out -j"$(nproc)" Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T505-SM6115-KernelSU-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error
          retention-days: 7
