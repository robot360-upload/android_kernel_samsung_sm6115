name: Build SM6115 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev \
            lld llvm make python3 rsync zstd

      - name: Install Neutron Clang
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -fLo antman \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S
          test -x bin/clang
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

          ./antman --patch=glibc
          ./antman -I
          bin/clang --version
          bin/ld.lld --version

      - name: Clone LineageOS kernel
        run: |
          set -euo pipefail
          git clone --depth=1 \
            --branch lineage-24.0 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115 \
            kernel

      - name: Install KernelSU-Next
        working-directory: kernel
        run: |
          set -euo pipefail
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s legacy

          test -f drivers/kernelsu/Kconfig
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
      - name: Search KernelSU Kprobe config symbol
        working-directory: kernel
        shell: bash
        run: |
          echo "=== Search entire kernel source ==="
          grep -R -n "KSU_KPROBE_HOOKS" . \
            --exclude-dir=out \
            --exclude-dir=.git || true
      - name: Replace namespace.c
        working-directory: kernel
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/robot360-upload/patches/main"

          curl -fL "$BASE/namespace.c" -o fs/namespace.c

          test -s fs/namespace.c
          grep -q 'path_umount' fs/namespace.c

          git diff --check

      - name: Enable Kprobes and KernelSU-Next
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"
          test -f "$CONFIG"

          for option in \
            CONFIG_KPROBES=y
            CONFIG_KRETPROBES=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_KSU=y
            CONFIG_KSU_KPROBES_HOOK=y
          do
            sed -i \
              "/^${option}=/d; /^# ${option} is not set$/d" \
              "$CONFIG"
          done

          cat >> "$CONFIG" <<'EOF'

          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=y
          EOF

          tail -n 12 "$CONFIG"

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          make O=out vendor/bengal-perf_defconfig

          scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            arch/arm64/configs/vendor/gta4l-common.config

          make O=out olddefconfig

      - name: Diagnose KernelSU Kprobes config
        working-directory: kernel
        shell: bash
        run: |
          echo "=== Kprobes config ==="
          grep -E '^(CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU|CONFIG_KSU_KPROBE_HOOKS)=|^# CONFIG_(KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBE_HOOKS) is not set' out/.config || true

          echo "=== KernelSU Kconfig declarations ==="
          grep -R -n 'KSU_KPROBE_HOOKS' drivers/kernelsu 2>/dev/null || true
      - name: Verify and upload kernel .config
        run: |
          set -euo pipefail
          CONFIG="kernel/out/.config"

          if [ ! -s "$CONFIG" ]; then
            echo "::error::Kernel config missing or empty: $CONFIG"
            exit 1
          fi

          ls -lh "$CONFIG"
      - name: Upload kernel .config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: kernel/out/.config
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify configuration and hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"

          for option in \
            CONFIG_KPROBES=y
            CONFIG_KRETPROBES=y
            CONFIG_KPROBE_EVENTS=y
            CONFIG_KSU=y
            CONFIG_KSU_KPROBES_HOOK=y
          do
            if ! grep -qx "${option}=y" "$CONFIG"; then
              echo "::error::${option} is not enabled"
              grep -E "^(${option}=|# ${option} is not set)" "$CONFIG" || true
              exit 1
            fi
          done

          grep -q 'path_umount' fs/namespace.c

          echo "All four required config options are enabled."
          echo "namespace.c path_umount backport is present."

      - name: Build uncompressed Image
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++

          clang --version
          make O=out -j"$(nproc)" Image

          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM-T505-SM6115-KernelSU-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
          if-no-files-found: error
          retention-days: 7
