name: Build2 SM6115 Kernel with Neutron Clang
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: robot360-upload/android_kernel_samsung_sm6115
          ref: lineage-24.0
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libncurses-dev libssl-dev python3 \
            rsync tar unzip zstd
      - name: Apply DroidSpaces non-GKI patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/droidspaces-patches
          echo "Downloading DroidSpaces non-GKI patches..."
          curl -fL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" \
            -o /tmp/droidspaces-patches/01.fix_kernel_panic_in_xt_qtaguid.patch
          curl -fL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" \
            -o "/tmp/droidspaces-patches/02.fix_restore cgroup file prefix handling .patch"
          echo "Verifying downloaded patches..."
          test -s /tmp/droidspaces-patches/01.fix_kernel_panic_in_xt_qtaguid.patch
          test -s "/tmp/droidspaces-patches/02.fix_restore cgroup file prefix handling .patch"
          echo "Checking patch 01..."
          if [ -f net/netfilter/xt_qtaguid.c ]; then
            patch --dry-run -p1 \
              < /tmp/droidspaces-patches/01.fix_kernel_panic_in_xt_qtaguid.patch
            patch -p1 \
              < /tmp/droidspaces-patches/01.fix_kernel_panic_in_xt_qtaguid.patch
          else
            echo "::warning::Skipping patch 01 because net/netfilter/xt_qtaguid.c is absent from this kernel source."
          fi
          echo "Checking patch 02..."
          patch --dry-run -p1 \
            < "/tmp/droidspaces-patches/02.fix_restore cgroup file prefix handling .patch"
          echo "Applying patch 02..."
          patch -p1 \
            < "/tmp/droidspaces-patches/02.fix_restore cgroup file prefix handling .patch"
          echo "Checking for whitespace errors..."
          git diff --check
          echo "Patch summary:"
          git diff --stat
          echo "Patch checksums:"
          sha256sum /tmp/droidspaces-patches/*.patch
      - name: Integrate BakaSU
        run: |
          set -euxo pipefail
          curl -LSs \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" \
            | bash
          test -d KernelSU/kernel
          echo "BakaSU commit:"
          git -C KernelSU rev-parse HEAD
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'CONFIG_KSU' drivers/Makefile
      - name: Apply BakaSU Linux 4.19 manual-hook patch
        run: |
          set -euxo pipefail
          PATCH_URL="https://raw.githubusercontent.com/robot360-upload/patches/main/bakasu_hooks_corrected.patch"
          curl -fL "$PATCH_URL" -o /tmp/bakasu_hooks_corrected.patch
          # Do not modify the source if the patch cannot apply cleanly.
          git apply --check /tmp/bakasu_hooks_corrected.patch
          git apply /tmp/bakasu_hooks_corrected.patch
          git diff --check
          git diff --stat
          sha256sum /tmp/bakasu_hooks_corrected.patch
      - name: Integrate NoMount
        run: |
          set -euxo pipefail
          curl -LSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            | bash
          test -L fs/nomount
          test -f fs/nomount/Kconfig
          echo "NoMount commit:"
          git -C NoMount rev-parse HEAD
          grep -q 'CONFIG_NOMOUNT' fs/Makefile
          grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig
      - name: Configure BakaSU, NoMount, and local version
        run: |
          set -euo pipefail
          CONFIG="arch/arm64/configs/vendor/gta4l-common.config"
          test -f "$CONFIG"
          # Remove previous copies of these settings.
          sed -i -E \
            '/^(CONFIG_LOCALVERSION=|# CONFIG_LOCALVERSION_AUTO is not set|CONFIG_LOCALVERSION_AUTO=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=|CONFIG_NOMOUNT=)/d' \
            "$CONFIG"
          cat >> "$CONFIG" <<'EOF'
          # Kernel release string
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n
          # BakaSU manual hooks
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          # NoMount
          CONFIG_NOMOUNT=y
          EOF
          cat "$CONFIG"
      - name: Download Neutron Clang
        run: |
          set -euo pipefail
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          mkdir -p "$TOOLCHAIN"
          cd "$TOOLCHAIN"
          curl -fL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman
          chmod +x antman
          ./antman -S
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
      - name: Verify Neutron Clang and LLVM linker
        run: |
          set -euo pipefail
          TOOLCHAIN="$HOME/toolchains/neutron-clang"
          export PATH="$TOOLCHAIN/bin:$PATH"
          command -v clang
          command -v ld.lld
          clang --version
          ld.lld --version
          test -x "$TOOLCHAIN/bin/clang"
          test -x "$TOOLCHAIN/bin/ld.lld"
      - name: Verify kernel configuration files
        shell: bash
        run: |
          set -euo pipefail
          test -f arch/arm64/configs/vendor/bengal-perf_defconfig
          test -f arch/arm64/configs/vendor/gta4l-common.config
          test -f arch/arm64/configs/vendor/droidspaces.config
          test -f scripts/kconfig/merge_config.sh
          echo "All required kernel configuration files exist."
      - name: Generate base configuration
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/bengal-perf_defconfig
      - name: Merge device and DroidSpaces configuration
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          scripts/kconfig/merge_config.sh \
            -O out \
            -m out/.config \
            arch/arm64/configs/vendor/gta4l-common.config \
            arch/arm64/configs/vendor/droidspaces.config

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig
      - name: Verify final kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"
          FRAGMENT="arch/arm64/configs/vendor/droidspaces.config"

          test -s "$CONFIG"
          test -s "$FRAGMENT"

          echo "Checking BakaSU and NoMount configuration..."

          grep -qx 'CONFIG_LOCALVERSION=""' "$CONFIG"
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' "$CONFIG"
          grep -qx 'CONFIG_KSU=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_NOMOUNT=y' "$CONFIG"

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "::error::Tracepoint hooking is enabled instead of manual hooking."
            exit 1
          fi

          echo "Checking every setting in droidspaces.config..."

          checked=0
          failed=0

          while IFS= read -r line || [ -n "$line" ]; do
            # Ignore blank lines and comments.
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            line="$(printf '%s' "$line" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [ -n "$line" ] || continue

            case "$line" in
              CONFIG_*=*)
                symbol="${line%%=*}"
                value="${line#*=}"

                case "$value" in
                  y) expected="$symbol=y" ;;
                  m) expected="$symbol=m" ;;
                  n) expected="# $symbol is not set" ;;
                  *) expected="$line" ;;
      - name: Verify final kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="out/.config"
          FRAGMENT="arch/arm64/configs/vendor/droidspaces.config"

          test -s "$CONFIG"
          test -s "$FRAGMENT"

          echo "Checking BakaSU and NoMount configuration..."

          grep -qx 'CONFIG_LOCALVERSION=""' "$CONFIG"
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' "$CONFIG"
          grep -qx 'CONFIG_KSU=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y' "$CONFIG"
          grep -qx 'CONFIG_NOMOUNT=y' "$CONFIG"

          if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' "$CONFIG"; then
            echo "::error::Tracepoint hooking is enabled instead of manual hooking."
            exit 1
          fi

          echo "Checking every setting in droidspaces.config..."

          checked=0
          failed=0

          while IFS= read -r line || [ -n "$line" ]; do
            # Ignore blank lines and comments.
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            line="$(printf '%s' "$line" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [ -n "$line" ] || continue

            case "$line" in
              CONFIG_*=*)
                symbol="${line%%=*}"
                value="${line#*=}"

                case "$value" in
                  y) expected="$symbol=y" ;;
                  m) expected="$symbol=m" ;;
                  n) expected="# $symbol is not set" ;;
                  *) expected="$line" ;;
                esac

                checked=$((checked + 1))

                if grep -Fqx -- "$expected" "$CONFIG"; then
                  echo "[OK] $symbol"
                else
                  echo "::error::Configuration mismatch: $line"
                  grep -E "^(# )?$symbol(=| is not set$)" "$CONFIG" || \
                    echo "  No corresponding setting found in $CONFIG"
                  failed=$((failed + 1))
                  fi
                ;;
            esac
          done < "$FRAGMENT"

          echo "DroidSpaces settings checked: $checked"
          echo "Configuration mismatches: $failed"

          if [ "$checked" -eq 0 ]; then
            echo "::error::No CONFIG assignments found in $FRAGMENT"
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed DroidSpaces setting(s) did not survive olddefconfig."
            exit 1
          fi

          echo "All DroidSpaces fragment settings match the final .config."
      - name: Build kernel Image
        run: |
          set -euo pipefail
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j2 \
            Image
      - name: Verify kernel image
        run: |
          set -euo pipefail
          IMAGE="out/arch/arm64/boot/Image"
          test -s "$IMAGE"
          file "$IMAGE"
          ls -lh "$IMAGE"
      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-bakasu-nomount-neutron-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14
