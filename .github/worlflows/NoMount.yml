name: Setup NoMount

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup-nomount-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download NoMount setup script
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" \
            -o /tmp/nomount-setup.sh

      - name: Run NoMount setup
        shell: bash
        run: bash /tmp/nomount-setup.sh

      - name: Stage changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Integrate NoMount"
          git push origin "HEAD:${GITHUB_REF_NAME}"
